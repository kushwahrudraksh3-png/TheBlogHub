<!-- header part  -->

{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Django Blogs</title>
  <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
  <link href="{% static 'css/blog.css' %}" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header class="blog-header py-3">
  <div class="row align-items-center">

    <!-- Logo -->
    <div class="col-md-3">
      <a class="blog-header-logo text-dark" href="/">TheBlogHub</a>
    </div>

    <!-- Search Bar -->
    <div class="col-md-6">
      <form action="{% url 'search' %}" method="GET">
        <div class="input-group">
          <input type="text" name="keyword" value="{{keyword}}" class="form-control" placeholder="Enter search term..." value="{{ request.GET.keyword }}">
          <div class="input-group-append">
            <button class="btn btn-primary" type="submit">Search</button>
          </div>
        </div>
      </form>
    </div>

    <!-- Login/Register -->
    <div class="col-md-3 text-right">
      {% if not user.is_authenticated %}
      <a class="btn btn-sm btn-warning" href="{% url 'login' %}">Login</a>
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'register' %}">Register</a>
      {% else %}
      <span>Your are Logged in {{user}} </span>
      <span><a class="btn btn-sm btn-warning" href="{% url 'logout' %}">Logout</a></span>
       
      {% endif %}
    </div>

  </div>
</header>

    <div class="nav-scroller py-1 mb-2">
      <nav class="nav d-flex justify-content-between">
        {% for category in categories %}
        <a class="p-2 text-muted" href="{% url 'post_by_category' category.id %}">{{category.category_name}}</a>
        {% endfor %}
      </nav>
    </div>


    <!-- main content part  -->

    {% block content %}

    {% endblock content %}

    <!-- footer part  -->

    <footer class="blog-footer">
      <p>Blogs built with 💙 by <a href="#">Rudraksh</a></p>
    </footer>
</body>

</html>
