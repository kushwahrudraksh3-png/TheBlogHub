{% extends "base.html" %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <!-- HEADING -->

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-lock text-warning"
                           style="font-size: 70px;">
                        </i>

                        <h2 class="mt-3 font-weight-bold">
                            Change Password
                        </h2>

                        <p class="text-muted">
                            Update your account password
                        </p>

                    </div>

                    <!-- FORM -->

                    <form method="POST">

                        {% csrf_token %}

                        <!-- OLD PASSWORD -->

                        <div class="form-group">

                            <label>
                                Old Password
                            </label>

                            <div class="input-group">

                                <input type="password"
                                       name="old_password"
                                       id="old_password"
                                       class="form-control"
                                       placeholder="Enter old password">

                                <div class="input-group-append">

                                    <span class="input-group-text"
                                          onclick="togglePassword('old_password', 'old_icon')"
                                          style="cursor: pointer;">

                                        <i class="fa-solid fa-eye"
                                           id="old_icon">
                                        </i>

                                    </span>

                                </div>

                            </div>

                        </div>

                        <!-- NEW PASSWORD -->

                        <div class="form-group">

                            <label>
                                New Password
                            </label>

                            <div class="input-group">

                                <input type="password"
                                       name="new_password1"
                                       id="new_password1"
                                       class="form-control"
                                       placeholder="Enter new password">

                                <div class="input-group-append">

                                    <span class="input-group-text"
                                          onclick="togglePassword('new_password1', 'new_icon')"
                                          style="cursor: pointer;">

                                        <i class="fa-solid fa-eye"
                                           id="new_icon">
                                        </i>

                                    </span>

                                </div>

                            </div>

                        </div>

                        <!-- CONFIRM PASSWORD -->

                        <div class="form-group">

                            <label>
                                Confirm Password
                            </label>

                            <div class="input-group">

                                <input type="password"
                                       name="new_password2"
                                       id="new_password2"
                                       class="form-control"
                                       placeholder="Confirm new password">

                                <div class="input-group-append">

                                    <span class="input-group-text"
                                          onclick="togglePassword('new_password2', 'confirm_icon')"
                                          style="cursor: pointer;">

                                        <i class="fa-solid fa-eye"
                                           id="confirm_icon">
                                        </i>

                                    </span>

                                </div>

                            </div>

                        </div>

                        <!-- BUTTONS -->

                        <div class="mt-4">

                            <button type="submit"
                                    class="btn btn-warning">

                                Update Password

                            </button>

                            <a href="{% url 'edit_profile' %}"
                               class="btn btn-secondary ml-2">

                                Back

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- JAVASCRIPT -->

<script>

    function togglePassword(inputId, iconId){

        let input = document.getElementById(inputId);

        let icon = document.getElementById(iconId);

        if(input.type === "password"){

            input.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

        }

        else{

            input.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

        }

    }

</script>

{% endblock content %}
