{% extends "base.html" %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <!-- HEADING -->

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-user-gear text-primary"
                           style="font-size: 65px;">
                        </i>

                        <h2 class="mt-3 font-weight-bold">
                            Edit Profile
                        </h2>

                        <p class="text-muted">
                            Update your account information
                        </p>

                    </div>

                    <!-- FORM START -->

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <!-- PROFILE IMAGE -->

                        <div class="text-center mb-4">

                            {% if profile.profile_image %}

                                <img src="{{profile.profile_image.url}}"
                                     class="rounded-circle shadow"
                                     width="140"
                                     height="140"
                                     style="object-fit: cover;">

                            {% else %}

                                <i class="fa-solid fa-user-circle text-secondary"
                                   style="font-size: 130px;">
                                </i>

                            {% endif %}

                        </div>

                        <!-- USERNAME -->

                        <div class="form-group">

                            <label>
                                Username
                            </label>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   value="{{request.user.username}}">

                        </div>

                        <!-- EMAIL -->

                        <div class="form-group">

                            <label>
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   value="{{request.user.email}}">

                        </div>

                        <!-- STAFF EXTRA FIELDS -->

                        {% if request.user.is_staff %}

                        <div class="form-group">

                            <label>
                                First Name
                            </label>

                            <input type="text"
                                   name="first_name"
                                   class="form-control"
                                   value="{{request.user.first_name}}">

                        </div>

                        <div class="form-group">

                            <label>
                                Last Name
                            </label>

                            <input type="text"
                                   name="last_name"
                                   class="form-control"
                                   value="{{request.user.last_name}}">

                        </div>

                        {% endif %}


                        <!-- BUTTONS -->

                        <div class="mt-4">

                            <button type="submit"
                                    class="btn btn-primary">

                                Update Profile

                            </button>

                            <a href="{% url "change_password" %}"
                               class="btn btn-warning ml-2">

                                Change Password

                            </a>

                            <a href="{% url 'profile' %}"
                               class="btn btn-secondary ml-2">

                                Back

                            </a>

                        </div>

                    </form>

                    <!-- FORM END -->

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock content %}
