<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories Not Found</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#ffffff;
      font-family:Georgia, serif;
    }

    .container{
      width:90%;
      max-width:1100px;
      background:#f2f2f2;
      padding:80px 50px;
    }

    .error-box{
      background:#ebebeb;
      padding:50px 40px;
      display:flex;
      align-items:center;
      gap:40px;
      border-radius:5px;
    }

    .error-number{
      font-size:90px;
      color:#8a8a8a;
      font-weight:bold;
    }

    .content h1{
      font-size:45px;
      color:#333;
      margin-bottom:15px;
    }

    .content p{
      font-size:22px;
      color:#555;
      margin-bottom:25px;
    }

    .btn{
      text-decoration:none;
      background:#333;
      color:white;
      padding:12px 25px;
      border-radius:5px;
      transition:0.3s;
      display:inline-block;
    }

    .btn:hover{
      background:black;
    }

    @media(max-width:768px){

      .error-box{
        flex-direction:column;
        text-align:center;
      }

      .error-number{
        font-size:70px;
      }

      .content h1{
        font-size:32px;
      }

      .content p{
        font-size:18px;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <div class="error-box">

      <div class="error-number">
        404
      </div>

      <div class="content">
        <h1>Category Does Not Exists!</h1>

        <p>
          The requested category was not found.
        </p>

        <a href="/" class="btn">
          Go Back Home
        </a>
      </div>

    </div>

  </div>

</body>
</html>
